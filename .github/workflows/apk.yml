name: Construire l'APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Les journaux de la CI ne sont pas lisibles depuis la session qui écrit ce
# code : l'hôte qui les sert est bloqué, et les artifacts aussi. Chaque pas
# garde donc sa sortie dans build.log, et en cas d'échec le journal repart en
# annotation, qui est lisible par l'API. Sans ça, un échec ne dit rien de plus
# que « exit code 1 ».
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version de Flutter
        run: set -o pipefail; flutter --version 2>&1 | tee -a build.log

      - name: Dépendances
        run: set -o pipefail; flutter pub get 2>&1 | tee -a build.log

      - name: Code généré
        run: |
          set -o pipefail
          dart run build_runner build 2>&1 \
            | tee -a build.log

      - name: Analyse statique
        run: set -o pipefail; flutter analyze --no-fatal-infos 2>&1 | tee -a build.log

      - name: Tests
        run: set -o pipefail; flutter test 2>&1 | tee -a build.log

      - name: Générer le projet Android
        run: |
          set -o pipefail
          {
            flutter create --platforms=android \
              --project-name miracle_business \
              --org com.miraclebusiness \
              /tmp/socle &&
            cp -r /tmp/socle/android ./android &&
            sed -i 's/android:label="miracle_business"/android:label="Miracle business"/' \
              android/app/src/main/AndroidManifest.xml
          } 2>&1 | tee -a build.log

      - name: Construire l'APK
        run: set -o pipefail; flutter build apk --release 2>&1 | tee -a build.log

      - name: Remonter le journal en cas d'échec
        if: failure()
        run: |
          python3 - <<'PY'
          try:
              texte = open('build.log', errors='replace').read()
          except OSError:
              texte = 'pas de journal'
          fin = texte[-5000:]
          encode = fin.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error::{encode}')
          for ligne in fin.splitlines()[-8:]:
              if ligne.strip():
                  print(f'::error::{ligne[:400]}')
          PY

      - name: Publier l'APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: miracle-business-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
