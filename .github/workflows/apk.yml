name: Construire l'APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Tout en un seul bloc, dont la sortie est gardée : les journaux de la CI
      # ne sont pas lisibles depuis la session qui écrit ce code, alors que le
      # résumé du job l'est. C'est par là que passent les erreurs.
      - name: Construire
        run: |
          set -o pipefail
          {
            flutter --version &&
            flutter pub get &&
            dart run build_runner build --delete-conflicting-outputs &&
            flutter analyze --no-fatal-infos &&
            flutter test &&
            flutter create --platforms=android \
              --project-name miracle_business \
              --org com.miraclebusiness \
              /tmp/socle &&
            cp -r /tmp/socle/android ./android &&
            sed -i 's/android:label="miracle_business"/android:label="Miracle business"/' \
              android/app/src/main/AndroidManifest.xml &&
            flutter build apk --release
          } 2>&1 | tee build.log

      - name: Journal dans le résumé
        if: always()
        run: |
          {
            echo '```'
            tail -c 50000 build.log 2>/dev/null || echo 'pas de journal'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier l'APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: miracle-business-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
